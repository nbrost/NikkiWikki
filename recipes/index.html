<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Box - Nikki Wikki Wiggle Bum</title>
    <link rel="stylesheet" href="https://nikkiwikkiwigglebum.com/css/style.css">
    <style>
        .recipe-tools { margin-bottom: 20px; }
        .recipe-tools form {
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
        }
        .recipe-tools input[type="text"], .recipe-tools input[type="url"], .recipe-tools input[type="password"] {
            flex: 1 1 320px; padding: 10px 12px; border: 2px solid #70a370;
            border-radius: 20px; font-size: 15px; background: #fff;
        }
        .recipe-tools button {
            padding: 10px 18px; border: 2px solid #70a370; border-radius: 20px;
            background: #70a370; color: #fff; font-size: 15px; cursor: pointer;
        }
        .recipe-tools button:disabled { opacity: .6; cursor: wait; }
        .status { margin: 12px 0; min-height: 20px; }
        .status.error { color: #a12b2b; }
        .status.ok { color: #2f6b2f; }
        .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 20px; }
        .tag-chip {
            border: 1px solid #70a370; border-radius: 14px; padding: 4px 10px;
            background: #e3efd8; cursor: pointer; font-size: 13px; color: #333;
        }
        .tag-chip.active { background: #70a370; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .card { background: #e3efd8; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 150px; object-fit: cover; max-width: none; }
        .card .body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .card a.title { font-weight: bold; color: #2f4d2f; text-decoration: none; }
        .card a.title:hover { text-decoration: underline; }
        .card .source { font-size: 12px; color: #557; }
        .card .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
        .card .card-tags span { background: #c2dbad; border-radius: 10px; padding: 2px 8px; font-size: 11px; }
        .card .card-tags .tag-remove {
            border: none; background: none; cursor: pointer; color: #a12b2b;
            font-size: 13px; line-height: 1; padding: 0 0 0 5px; vertical-align: middle;
        }
        .add-tag { display: flex; gap: 6px; margin-top: 4px; }
        .add-tag input { flex: 1; min-width: 0; padding: 4px 8px; border: 1px solid #70a370; border-radius: 12px; font-size: 12px; }
        .add-tag button { padding: 3px 10px; border: 1px solid #70a370; border-radius: 12px; background: #70a370; color: #fff; cursor: pointer; font-size: 12px; }
        #manual-details { margin-top: 10px; }
        #manual-details summary { cursor: pointer; color: #2f4d2f; font-weight: bold; }
        #manual-form { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
        #manual-form textarea {
            padding: 10px 12px; border: 2px solid #70a370; border-radius: 10px;
            font-size: 14px; font-family: inherit; resize: vertical;
        }
        #manual-form input { padding: 10px 12px; border: 2px solid #70a370; border-radius: 20px; font-size: 15px; }
        #manual-form button { align-self: flex-start; padding: 10px 18px; border: 2px solid #70a370; border-radius: 20px; background: #70a370; color: #fff; cursor: pointer; }
        .ing-row { display: flex; flex-wrap: wrap; gap: 5px; cursor: pointer; }
        .ing-chip { background: #d7e6c6; border: 1px solid #a8c48a; border-radius: 10px; padding: 2px 8px; font-size: 11px; color: #3c5a3c; }
        .ing-more { font-size: 12px; color: #2f6b2f; font-weight: bold; align-self: center; }
        .modal[hidden] { display: none; }
        .modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; }
        .modal-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45); cursor: pointer; }
        .modal-content {
            position: relative; max-width: 560px; width: calc(100% - 40px); max-height: 80vh; overflow-y: auto;
            background: #c2dbad; border-radius: 12px; padding: 24px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        }
        .modal-close { position: absolute; top: 10px; right: 12px; border: none; background: none; font-size: 26px; cursor: pointer; color: #2f4d2f; line-height: 1; }
        .modal-content h2 { margin: 0 32px 12px 0; color: #2f4d2f; }
        #modal-ingredients { padding-left: 20px; margin-bottom: 16px; color: #333; }
        #modal-ingredients li { margin: 4px 0; }
        .modal-link { display: inline-block; padding: 10px 16px; border: 2px solid #70a370; border-radius: 20px; background: #70a370; color: #fff; text-decoration: none; font-weight: bold; }
        .modal-link:hover { background: #5c8f5c; }
        .card .delete { align-self: flex-start; margin-top: auto; background: none; border: none; color: #a12b2b; cursor: pointer; font-size: 12px; padding: 4px 0; }
        .ingredients { font-size: 12px; color: #456; }
        details summary { cursor: pointer; font-size: 12px; color: #2f4d2f; }
    </style>
</head>
<body>
    <a href="/" id="floating-button">
        <img src="https://nikkiwikkiwigglebum.com/images/nicole.png" alt="Home">
        Nikki Wikki
    </a>
    <div class="container">
        <h1>Nicole's Recipe Box</h1>
        <p>Paste a link to a recipe you found online and we'll save it and tag it by its ingredients.</p>

        <div class="recipe-tools">
            <form id="login-form">
                <input type="password" id="password-input" placeholder="Enter the shared password to add recipes" autocomplete="current-password">
                <button type="submit" id="login-btn">Unlock</button>
            </form>
            <p class="status" id="status"></p>
        </div>

        <div class="recipe-tools" id="unlocked-area" hidden>
            <form id="add-form">
                <input type="text" inputmode="url" id="recipe-url" placeholder="https://example.com/tasty-recipe" required>
                <button type="submit" id="add-btn">Save recipe</button>
                <button type="button" id="lock-btn">Lock</button>
            </form>
            <details id="manual-details">
                <summary>Add manually (paste the ingredients)</summary>
                <form id="manual-form">
                    <input type="text" inputmode="url" id="manual-url" placeholder="https://... (link to the recipe)">
                    <input type="text" id="manual-title" placeholder="Recipe title">
                    <textarea id="manual-ingredients" rows="6" placeholder="One ingredient per line, e.g.&#10;2 cups flour&#10;1 tsp salt"></textarea>
                    <input type="text" id="manual-tags" placeholder="Extra tags, comma separated (optional)">
                    <button type="submit" id="manual-btn">Save manually</button>
                </form>
            </details>
        </div>

        <form id="search-form" class="recipe-tools">
            <input type="text" id="search-input" placeholder="Search saved recipes by title...">
        </form>

        <div class="tags" id="tag-list"></div>
        <div class="grid" id="recipe-list"></div>

        <div class="modal" id="modal" hidden>
            <div class="modal-backdrop" id="modal-backdrop"></div>
            <div class="modal-content">
                <button type="button" class="modal-close" id="modal-close" aria-label="Close">&times;</button>
                <h2 id="modal-title"></h2>
                <ul id="modal-ingredients"></ul>
                <a id="modal-link" class="modal-link" target="_blank" rel="noopener">View original recipe</a>
            </div>
        </div>
    </div>

    <div class="footer" id="footer">
        <p>Background image by <a href="https://www.freepik.com/free-vector/watercolor-floral-background_7607060.htm" target="_blank">pikisuperstar</a> on Freepik</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
